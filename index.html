
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Git Project</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            text-align: center;
        }

        header {
            background: #1d4ed8;
            color: white;
            padding: 25px;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px #0002;
        }

        button {
            background: #1d4ed8;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            main {
                margin: 15px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Git Project</h1>
    </header>

    <main>
        <div class="card">
            <h2>Hello, Git and GitHub!</h2>
            <p>I am learning HTML, CSS, responsive design, and Git.</p>
            <button onclick="alert('Working successfully!')">
                Click Me
            </button>
        </div>
    </main>
</body>
</html>
